<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart | Laptop Store</title>
  <link rel="stylesheet" href="css/pages/cart.css">
</head>

<body>
  <nav class="navbar">
    <b class="logo">Laptop Store</b>

    <div class="links">
      <a href="#">Home</a>
      <a href="products.html">Products</a>
      <a href="#">Compare</a>
      <a href="cart.html" class="active">Cart</a>
      <a href="#">Orders</a>
    </div>

    <span class="nav-cart">
      🛒 Cart (<span id="navCount">0</span> items)
    </span>
  </nav>

  <main>
    <div id="cartPage">
      <section class="top-box">
        <div class="top-row">
          <div>
            <small class="blue">● HARDWARE ALLOCATION VERIFIED</small>
            <h1>
              Your Engineered Cart
              <span id="count" class="light"></span>
            </h1>
          </div>
          <div class="ship-note" id="shipNote"></div>
        </div>

        <div class="bar">
          <div id="barFill"></div>
        </div>
      </section>

      <div class="layout">
        <section id="items"></section>

        <aside class="summary">
          <div class="sum-head">
            <h2>Order Summary</h2>
            <small>USD</small>
          </div>

          <div class="row">
            <span id="unitsText">Subtotal</span>
            <b id="subtotal"></b>
          </div>

          <div class="row blue">
            <span>Discount</span>
            <b id="discount"></b>
          </div>

          <div class="row">
            <span>Shipping</span>
            <b id="shipping"></b>
          </div>

          <div class="row">
            <span>Estimated Sales Tax</span>
            <b id="tax"></b>
          </div>

          <div class="total">
            <h3>Total Due</h3>
            <strong id="total"></strong>
          </div>

          <small class="label">PROMO CODE OR EDU PASS</small>

          <div class="promo">
            <input id="promoInput" placeholder="Enter code">
            <button onclick="usePromo()">APPLY</button>
          </div>

          <button class="checkout" onclick="goToCheckout('card')">
            Proceed to Secure Checkout
          </button>

          <p class="or">OR EXPRESS CHECKOUT</p>

          <div class="express">
            <button class="apple" onclick="goToCheckout('applepay')"> Pay</button>
            <button class="gpay" onclick="goToCheckout('gpay')">GPay</button>
            <button class="paypal" onclick="goToCheckout('paypal')">PayPal</button>
          </div>
        </aside>
      </div>
    </div>

    <div id="empty" class="empty" hidden>
      <div class="big-icon">🛒</div>
      <h2>Your Cart Is Empty</h2>
      <button class="checkout" onclick="continueShopping()">Continue Shopping</button>
    </div>

    <div id="msg" class="msg" hidden></div>
  </main>

  <script src="js/stores/cartStore.js"></script>
  <script src="js/pages/cart.js"></script>
</body>

</html>
