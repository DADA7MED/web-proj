<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Product Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/pages/admin.css">
</head>
<body class="admin">

  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-brand">
      <span class="admin-brand__logo">LS</span>
      <div>
        <div class="admin-brand__name">A Lap</div>
        <div class="admin-brand__tag">ADMIN PANEL</div>
      </div>
    </div>

    <nav class="admin-nav">
      <p class="admin-nav__label">MANAGEMENT</p>
      <a class="admin-nav__link" href="index.html">Dashboard</a>
      <a class="admin-nav__link is-active" href="products.html">Products</a>
      <a class="admin-nav__link" href="categories.html">Categories</a>
      <a class="admin-nav__link" href="orders.html">Orders</a>
      <a class="admin-nav__link admin-nav__link--store" href="../index.html">Customer Storefront ↗</a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <button class="admin-header__menu" id="menu-btn" aria-label="Toggle menu">☰</button>
      <span class="admin-header__crumb">ADMIN <span>›</span> Products <span>›</span> <span id="form-crumb-action">New Product</span></span>
    </header>

    <main class="admin-content">
      <div class="admin-page-head">
        <div>
          <h1 id="page-title">Add New Product</h1>
          <p class="admin-muted-text">Fill in the specifications to publish hardware to the catalog.</p>
        </div>
        <a class="admin-btn" href="products.html">← Back to Products</a>
      </div>

      <div class="admin-card" style="max-width: 800px;">
        <form id="product-form">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div style="grid-column: 1 / -1;">
              <label class="admin-label">Product Name *</label>
              <input type="text" id="p-name" class="admin-input" placeholder="e.g. Zenith Pro 16 Extreme" required style="width: 100%;">
            </div>

            <div>
              <label class="admin-label">Category *</label>
              <select id="p-category" class="admin-input" required style="width: 100%;">
                <option value="">Select Category</option>
              </select>
            </div>

            <div>
              <label class="admin-label">Brand</label>
              <input type="text" id="p-brand" class="admin-input" placeholder="e.g. Apex, Apple, Dell" style="width: 100%;">
            </div>

            <div>
              <label class="admin-label">Price ($) *</label>
              <input type="number" id="p-price" class="admin-input" placeholder="1999" min="0" step="0.01" required style="width: 100%;">
            </div>

            <div>
              <label class="admin-label">Old / Was Price ($)</label>
              <input type="number" id="p-old-price" class="admin-input" placeholder="2299" min="0" step="0.01" style="width: 100%;">
            </div>

            <div>
              <label class="admin-label">Stock Units *</label>
              <input type="number" id="p-stock" class="admin-input" placeholder="15" min="0" required style="width: 100%;">
            </div>

            <div>
              <label class="admin-label">Badge Text</label>
              <input type="text" id="p-badge" class="admin-input" placeholder="e.g. BEST SELLER, NEW RELEASE" style="width: 100%;">
            </div>

            <div>
              <label class="admin-label">CPU Specification</label>
              <input type="text" id="p-cpu" class="admin-input" placeholder="e.g. Core Ultra 9 / M4 Max" style="width: 100%;">
            </div>

            <div>
              <label class="admin-label">RAM Specification</label>
              <input type="text" id="p-ram" class="admin-input" placeholder="e.g. 32 GB LPDDR5X" style="width: 100%;">
            </div>

            <div>
              <label class="admin-label">Storage Specification</label>
              <input type="text" id="p-storage" class="admin-input" placeholder="e.g. 1 TB Gen4 NVMe" style="width: 100%;">
            </div>

            <div>
              <label class="admin-label">GPU Specification</label>
              <input type="text" id="p-gpu" class="admin-input" placeholder="e.g. RTX 4080 12GB" style="width: 100%;">
            </div>

            <div style="grid-column: 1 / -1;">
              <label class="admin-label">Image Path / URL</label>
              <input type="text" id="p-image" class="admin-input" placeholder="assets/images/products/zenith-pro-16.jpeg" style="width: 100%;">
            </div>

            <div style="grid-column: 1 / -1;">
              <label class="admin-label">Description</label>
              <textarea id="p-desc" class="admin-input" rows="3" placeholder="Engineered for high-compute workloads..." style="width: 100%; resize: vertical;"></textarea>
            </div>
          </div>

          <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="admin-btn admin-btn--primary" id="save-btn">Save Product</button>
            <a href="products.html" class="admin-btn">Cancel</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="../js/pages/admin/adminProductForm.js"></script>
</body>
</html>
