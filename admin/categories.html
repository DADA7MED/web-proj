<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Categories Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/pages/admin.css">
</head>
<body class="admin">

  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-brand">
      <span class="admin-brand__logo">LS</span>
      <div>
        <div class="admin-brand__name">Laptop Store</div>
        <div class="admin-brand__tag">ADMIN PANEL</div>
      </div>
    </div>

    <nav class="admin-nav">
      <p class="admin-nav__label">MANAGEMENT</p>
      <a class="admin-nav__link" href="index.html">Dashboard</a>
      <a class="admin-nav__link" href="products.html">Products</a>
      <a class="admin-nav__link is-active" href="categories.html">Categories</a>
      <a class="admin-nav__link" href="orders.html">Orders</a>
      <a class="admin-nav__link admin-nav__link--store" href="../index.html">Customer Storefront ↗</a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <button class="admin-header__menu" id="menu-btn" aria-label="Toggle menu">☰</button>
      <span class="admin-header__crumb">ADMIN <span>›</span> Categories</span>
    </header>

    <main class="admin-content">
      <div class="admin-page-head">
        <div>
          <h1>Categories &amp; Brands</h1>
          <p class="admin-muted-text">Manage computing architectures, form factors, and brand ecosystems.</p>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Name</th>
                <th>Slug</th>
                <th>Models / Systems</th>
                <th>Baseline Price</th>
              </tr>
            </thead>
            <tbody id="categories-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { categoriesStore } from "../../stores/categoriesStore.js";
    import { initSidebarToggle, formatMoney } from "../admin/adminUtils.js";

    initSidebarToggle();
    await categoriesStore.init();

    const tbody = document.getElementById("categories-body");
    const all = categoriesStore.getAll();

    tbody.innerHTML = all.map(c => `
      <tr>
        <td>#${c.id}</td>
        <td><span class="admin-badge ${c.type === 'brand' ? 'admin-badge--brand' : 'admin-badge--ok'}">${c.type}</span></td>
        <td class="admin-product-name">${c.name}</td>
        <td><code>${c.slug}</code></td>
        <td>${c.models_count || '–'}</td>
        <td>${c.baseline_price ? formatMoney(c.baseline_price) : '–'}</td>
      </tr>
    `).join('');
  </script>
</body>
</html>
